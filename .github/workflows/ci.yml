name: CI

on:
  push:
    branches: [snapshot]
  pull_request:
    branches: [snapshot]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [20, 22]

    steps:
      - uses: actions/checkout@v4

      - name: Use Node.js ${{ matrix.node-version }}
        uses: actions/setup-node@v4
        with:
          node-version: ${{ matrix.node-version }}
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build

      - name: Regenerate example output
        run: npm run generate:example

      - name: Regenerate genconfig model
        run: node dist/cli/index.js generate -m model/genconfig.ecore -c model/genconfig.genconfig.xmi

      - name: Checked-in generated code must match the templates
        run: git diff --exit-code examples/generated src/genconfig/model

      - name: Test
        run: npx vitest run

      - name: Upload build artifacts
        if: matrix.node-version == 22
        uses: actions/upload-artifact@v4
        with:
          name: dist
          path: dist/
          retention-days: 30
